name: Build Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-nuitka:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install Pillow pandas openpyxl -r requirements.txt

      - name: Nuitka 打包 (原生编译，无 PyInstaller PKG 嵌入)
        uses: Nuitka/Nuitka-Action@v1.4
        with:
          script-name: inventory_pro.py
          mode: standalone
          output-dir: dist
          enable-plugins: tk-inter
          include-package: PIL

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: InventoryPro_Nuitka
          path: dist
