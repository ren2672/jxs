name: Build x86 Windows exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: windows-latest  # x64 Windows，GitHub 免费提供
    steps:
      - uses: actions/checkout@v4

      - name: 安装 32 位 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x86

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow
          pip install numpy pandas openpyxl --only-binary :all:

      - name: 打包 x86 exe
        run: |
          python -m PyInstaller --onefile --windowed --name InventoryPro_x86 ^
            --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageTk ^
            --hidden-import sqlite3 inventory_pro.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: InventoryPro_x86
          path: dist/InventoryPro_x86.exe
